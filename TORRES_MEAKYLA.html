<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Basic Calculator</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(to bottom, #1e90ff, #000);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
    }

    .card {
        background-color: #ffffff;
        width: 320px;
        padding: 25px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    h2 {
        margin-top: 0;
        color: #1e90ff;
    }

    .output-box {
        margin: 15px 0;
        padding: 12px;
        border: 2px dashed #1e90ff;
        font-size: 22px;
        font-weight: bold;
        color: #333;
    }

    .btns {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button {
        padding: 12px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #1e90ff;
        color: white;
    }

    button:hover {
        background-color: #0b63c7;
    }

    .note {
        margin-top: 15px;
        font-size: 13px;
        color: #555;
    }
</style>
</head>

<body>

<div class="card">
    <h2>Basic Calculator</h2>
    <p>Declare Variable <b>5</b> and <b>7</b> to use on calculation.</p>

    <p><b>Output Here!</b></p>
    <div id="output" class="output-box">---</div>

    <div class="btns">
        <button onclick="add()">+</button>
        <button onclick="subtract()">-</button>
        <button onclick="multiply()">*</button>
        <button onclick="divide()">/</button>
    </div>

    <div class="note">
        Result will display at "Output Here!"
    </div>
</div>

<script>
    // Declare variables
    let x = 5;
    let y = 7;

    function add() {
        document.getElementById("output").innerHTML = x + y;
    }

    function subtract() {
        document.getElementById("output").innerHTML = x - y;
    }

    function multiply() {
        document.getElementById("output").innerHTML = x * y;
    }

    function divide() {
        document.getElementById("output").innerHTML = x / y;
    }
</script>

</body>
</html>
